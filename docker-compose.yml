services:
  # Laravel PHP-FPM Application Service
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: review_system_app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
    environment:
      - APP_ENV=${APP_ENV:-local}
      - APP_DEBUG=${APP_DEBUG:-true}
      - DB_CONNECTION=${DOCKER_DB_CONNECTION:-mysql}
      - DB_HOST=${DOCKER_DB_HOST:-db}
      - DB_PORT=${DOCKER_DB_PORT:-3306}
      - DB_DATABASE=${DOCKER_DB_DATABASE:-review_db}
      - DB_USERNAME=${DOCKER_DB_USERNAME:-review_user}
      - DB_PASSWORD=${DOCKER_DB_PASSWORD:-secret}
      - REDIS_HOST=${DOCKER_REDIS_HOST:-redis}
      - REDIS_PORT=${DOCKER_REDIS_PORT:-6379}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - review_network

  # Nginx Web Server
  nginx:
    image: nginx:alpine
    container_name: review_system_nginx
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8000}:80"
    volumes:
      - ./:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - review_network

  # MySQL Database Service
  db:
    image: mysql:8.0
    container_name: review_system_db
    restart: unless-stopped
    command: >
      --default-authentication-plugin=mysql_native_password
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
    ports:
      - "${DB_FORWARD_PORT:-3306}:3306"
    environment:
      MYSQL_DATABASE: ${DOCKER_DB_DATABASE:-review_db}
      MYSQL_USER: ${DOCKER_DB_USERNAME:-review_user}
      MYSQL_PASSWORD: ${DOCKER_DB_PASSWORD:-secret}
      MYSQL_ROOT_PASSWORD: ${DOCKER_DB_ROOT_PASSWORD:-root_secret}
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - review_network
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$${MYSQL_ROOT_PASSWORD:-root_secret} || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s

  # Redis Cache & Queue Backend
  redis:
    image: redis:alpine
    container_name: review_system_redis
    restart: unless-stopped
    ports:
      - "${REDIS_FORWARD_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    networks:
      - review_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # Background Queue Worker
  queue:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: review_system_queue
    restart: unless-stopped
    working_dir: /var/www/html
    command: php artisan queue:work --verbose --tries=3 --timeout=90
    volumes:
      - ./:/var/www/html
    environment:
      - APP_ENV=${APP_ENV:-local}
      - DB_CONNECTION=${DOCKER_DB_CONNECTION:-mysql}
      - DB_HOST=${DOCKER_DB_HOST:-db}
      - DB_PORT=${DOCKER_DB_PORT:-3306}
      - DB_DATABASE=${DOCKER_DB_DATABASE:-review_db}
      - DB_USERNAME=${DOCKER_DB_USERNAME:-review_user}
      - DB_PASSWORD=${DOCKER_DB_PASSWORD:-secret}
      - REDIS_HOST=${DOCKER_REDIS_HOST:-redis}
      - REDIS_PORT=${DOCKER_REDIS_PORT:-6379}
    depends_on:
      app:
        condition: service_started
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - review_network

  # phpMyAdmin (Web-based Database Management)
  phpmyadmin:
    image: phpmyadmin/phpmyadmin:latest
    container_name: review_system_phpmyadmin
    restart: unless-stopped
    ports:
      - "${PMA_PORT:-8080}:80"
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      UPLOAD_LIMIT: 64M
    depends_on:
      db:
        condition: service_healthy
    networks:
      - review_network

# Persistent Volumes
volumes:
  db_data:
    driver: local
  redis_data:
    driver: local

# Network Definition
networks:
  review_network:
    driver: bridge
